services:
  - type: web
    name: skytech-airline-reservation-system
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        value: com.mysql.cj.jdbc.Driver
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: REEF_API_KEY
        sync: false
      - key: REEF_API_URL
        value: https://api.reefapi.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SKYTECH_SUPPORT_EMAIL
        value: support@skytech.com
      - key: SKYTECH_SUPPORT_PHONE
        value: "+91 1800-SKY-TECH"
